<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Daniel Harrison — Software Developer &amp; Applied AI Engineer</title>
    <meta
      name="description"
      content="Desenvolvedor Full Stack com 3 anos de experiência em backend, integrações e infraestrutura. Hoje construo agentes de IA que rodam em produção."
    />
    <meta name="author" content="Daniel Harrison" />
    <meta name="color-scheme" content="light dark" />

    <!-- Cor da barra do navegador acompanha o tema -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfbfc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16171a" />

    <!-- Open Graph / Twitter -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Daniel Harrison" />
    <meta property="og:title" content="Daniel Harrison — Software Developer &amp; Applied AI Engineer" />
    <meta
      property="og:description"
      content="Backend, integrações e infraestrutura. Hoje construo agentes de IA que rodam em produção."
    />
    <meta property="og:url" content="https://danielharrison.vercel.app" />
    <meta property="og:image" content="https://danielharrison.vercel.app/uploads/backback.png" />
    <meta property="og:image:alt" content="Daniel Harrison" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Daniel Harrison — Software Developer &amp; Applied AI Engineer" />
    <meta
      name="twitter:description"
      content="Desenvolvedor Full Stack com 3 anos de experiência. Hoje construo agentes de IA que rodam em produção."
    />
    <meta name="twitter:image" content="https://danielharrison.vercel.app/uploads/backback.png" />
    <link rel="canonical" href="https://danielharrison.vercel.app" />

    <!--
      Uma única família tipográfica (Inter, pesos 400–700, eixo variável,
      subset latin). A identidade vem do contraste entre a sans e a stack
      monoespaçada do sistema — não de uma terceira fonte.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap"
      rel="stylesheet"
    />

    <!--
      Aplica o tema antes da primeira pintura para evitar flash de tema errado.
      A chave precisa bater com a usada em src/hooks/useTheme.ts.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('dh_theme');
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
